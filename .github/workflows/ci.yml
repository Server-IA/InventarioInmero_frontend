name: Frontend CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ci:
    name: Install → Build → Test → Lint → E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build (dev)
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Lint
        continue-on-error: true
        run: npm run lint

      # ── E2E ──────────────────────────────────────
      - name: Build (back desplegado)
        run: |
          npm run build
          ln -sf . dist/inventario
        env:
          VITE_BACKEND_URI: https://dev.api.inmero.co/inventario

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Start serve
        run: npx serve -s dist -l 5173 &

      - name: Wait for serve
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/inventario/ | grep -q 200 && break
            sleep 2
          done

      - name: E2E shard 1/2
        env:
          VITE_BACKEND_URI: https://dev.api.inmero.co/inventario
          E2E_BASE_URL: http://localhost:5173
          E2E_WEB_SERVER_URL: http://localhost:5173
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_COMPANY_CONTEXT_NAME: ${{ secrets.E2E_COMPANY_CONTEXT_NAME }}
          E2E_COMPANY_CONTEXT_ROLE_NAME: ${{ secrets.E2E_COMPANY_CONTEXT_ROLE_NAME }}
          E2E_NOADMIN_EMAIL: ${{ secrets.E2E_NOADMIN_EMAIL }}
          E2E_NOADMIN_PASSWORD: ${{ secrets.E2E_NOADMIN_PASSWORD }}
        run: npx playwright test --shard=1/2

      - name: E2E shard 2/2
        env:
          VITE_BACKEND_URI: https://dev.api.inmero.co/inventario
          E2E_BASE_URL: http://localhost:5173
          E2E_WEB_SERVER_URL: http://localhost:5173
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_COMPANY_CONTEXT_NAME: ${{ secrets.E2E_COMPANY_CONTEXT_NAME }}
          E2E_COMPANY_CONTEXT_ROLE_NAME: ${{ secrets.E2E_COMPANY_CONTEXT_ROLE_NAME }}
          E2E_NOADMIN_EMAIL: ${{ secrets.E2E_NOADMIN_EMAIL }}
          E2E_NOADMIN_PASSWORD: ${{ secrets.E2E_NOADMIN_PASSWORD }}
        run: npx playwright test --shard=2/2

      - name: Stop serve
        if: always()
        run: kill $(lsof -t -i:5173) 2>/dev/null || true
